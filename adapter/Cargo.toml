[package]
name = "veto-swig-gate"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"

[lib]
crate-type = ["cdylib", "lib"]

[features]
client = [
  "dep:anyhow",
  "dep:base64",
  "dep:solana-client",
  "dep:solana-commitment-config",
  "dep:solana-sdk",
  "dep:solana-system-interface",
  "dep:swig-interface",
  "dep:swig-state",
]

[dependencies]
anyhow = { version = "1.0", optional = true }
base64 = { version = "0.22.1", optional = true }
bincode = "1.3.3"
solana-client = { version = "3.1.11", optional = true }
solana-commitment-config = { version = "3.0.0", optional = true }
solana-loader-v3-interface = { version = "6.1.0", features = ["bincode"] }
solana-program = "3.0.0"
solana-sdk = { version = "3.0.0", optional = true }
solana-sdk-ids = "3.0"
solana-system-interface = { version = "3.1.0", features = ["bincode"], optional = true }
serde_json = "=1.0.151"
swig-interface = { git = "https://github.com/anagrambuild/swig-wallet", rev = "3e0411f0c2980b26296903eaa4aa0c2d07869316", optional = true }
swig-state = { git = "https://github.com/anagrambuild/swig-wallet", rev = "3e0411f0c2980b26296903eaa4aa0c2d07869316", optional = true }

[[bin]]
name = "local_swig_flow"
path = "src/bin/local_swig_flow.rs"
required-features = ["client"]

[[bin]]
name = "external_operator_signer"
path = "src/bin/external_operator_signer.rs"
required-features = ["client"]

[[bin]]
name = "payment_flow"
path = "src/bin/payment_flow.rs"
required-features = ["client"]

[[bin]]
name = "route_flow"
path = "src/bin/route_flow.rs"
required-features = ["client"]

[[bin]]
name = "operator_server"
path = "src/bin/operator_server.rs"
required-features = ["client"]

[workspace]
